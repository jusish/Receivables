<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Container Base with Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Flow Loop Path -->
  <path
    d="M18 40 C12 36, 12 26, 19 21 C26 16, 34 22, 38 27 L46 36 C50 41, 56 41, 58 37 C60 33, 58 26, 52 24"
    stroke="url(#primaryGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Upward Collection Arrow -->
  <path
    d="M32 46 L47 22 M47 22 L38 21 M47 22 L48 30"
    stroke="url(#accentGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Ledger Balance Bars -->
  <rect x="22" y="29" width="10" height="2.5" rx="1.25" fill="#38BDF8" opacity="0.85" />
  <rect x="22" y="34" width="14" height="2.5" rx="1.25" fill="#34D399" opacity="0.85" />
</svg>
