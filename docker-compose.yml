name: receivables

services:
  postgres:
    image: postgres:16-alpine
    container_name: receivables-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: receivables
      POSTGRES_PASSWORD: receivables_secret
      POSTGRES_DB: receivables_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U receivables -d receivables_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: receivables-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: receivables-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: receivables_minio_admin
      MINIO_ROOT_PASSWORD: receivables_minio_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-03-03T17-50-39Z
    container_name: receivables-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 receivables_minio_admin receivables_minio_secret;
      /usr/bin/mc mb myminio/receivables-documents --ignore-existing;
      /usr/bin/mc anonymous set download myminio/receivables-documents;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
